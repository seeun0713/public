<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테스트 결과 — 인간</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="typetest-page human">

  <!-- 헤더 (검정 바 127px) — 귀신 유형 테스트 페이지와 같은 머리말 -->
  <header class="typetest-header">
    <a class="icon left" href="human-test.html" aria-label="테스트로 돌아가기">
      <img src="images/dogam2-icon-back.svg" alt="" />
    </a>
    <h1 class="typetest-brand">테스트 결과</h1>
    <button class="icon right menu-toggle" type="button" aria-label="메뉴">
      <img src="images/dogam2-icon-menu.svg" alt="" />
    </button>
  </header>

  <!-- 오방색 띠 -->
  <div class="saekdong-band top"></div>

  <main class="page result-page">
    <h2>당신의 유형</h2>

    <section class="result-card">
      <p class="result-type" id="result-type">유형 이름</p>
      <p class="result-info" id="result-info">유형에 대한 설명이 여기에 표시됩니다.</p>
    </section>

    <section>
      <h2>당신과 어울리는 귀신</h2>
      <div class="card-grid" id="result-ghosts">
        <!-- 유형에 맞는 귀신 목록이 js/script.js 에서 채워집니다 -->
      </div>
    </section>

    <a class="btn" href="human-test.html">다시 테스트하기</a>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
