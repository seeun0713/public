<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시험 결과 — 귀신</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<!--
  인간 유사도 시험 결과

  점수(0~100)에 따라 8단계 중 하나가 나옵니다.
  내용은 js/script.js 의 ghostLevels / showGhostResult 가 채웁니다.
  주소 뒤에 ?score=73 을 붙이면 그 점수로 바로 볼 수 있습니다(확인용).
-->
<body class="exam-page ghost">
  <div class="exam-wrap">

    <!-- 헤더 — 인간 유사도 시험 페이지와 같은 머리말 -->
    <header class="exam-header">
      <a class="icon left" href="ghost-exam.html" aria-label="시험으로 돌아가기">
        <img src="images/dogam2-icon-back.svg" alt="" />
      </a>
      <h1 class="exam-brand">시험 결과</h1>
      <button class="icon right menu-toggle" type="button" aria-label="메뉴">
        <img src="images/dogam2-icon-menu.svg" alt="" />
      </button>
    </header>

    <!-- 4모서리 장식 -->
    <i class="exam-corner tl"></i>
    <i class="exam-corner tr"></i>
    <i class="exam-corner bl"></i>
    <i class="exam-corner br"></i>

    <main class="exam-result">

      <!-- 점수 + 단계 -->
      <section class="exam-score-card">
        <p class="label">인간 유사도</p>
        <p class="score"><span id="result-score">0</span><span class="unit">%</span></p>
        <p class="step" id="result-step">- 단계</p>
        <p class="grade" id="result-grade">-</p>
        <p class="summary" id="result-summary">한 줄 요약이 들어갑니다.</p>
      </section>

      <!-- 판정 내용 -->
      <section class="exam-block">
        <h2>판정</h2>
        <p class="exam-desc" id="result-desc">설명이 들어갑니다.</p>
        <p class="exam-mate">
          가장 닮은 존재 · <a id="result-ghost" href="#">귀신</a>
        </p>
      </section>

      <!-- 조례 -->
      <section class="exam-block">
        <h2>공존에 관한 조례 대조</h2>
        <p class="exam-law" id="result-law">조례 판정이 들어갑니다.</p>
      </section>

      <!-- 다음 단계 -->
      <section class="exam-block">
        <h2>다음 단계까지</h2>
        <p class="exam-next" id="result-next">과제가 들어갑니다.</p>
      </section>

      <!-- 증명서 -->
      <section class="exam-cert">
        <h2 class="cert-doc" id="cert-doc">인간 자격 증명서</h2>
        <p class="cert-line">위 귀신은 인간 유사도 시험을 치러</p>
        <p class="cert-line">아래 단계에 해당함을 증명함.</p>
        <p class="cert-grade" id="cert-grade">등급</p>
        <p class="cert-seal">— 귀신 위원회 —</p>
      </section>

      <a class="exam-retry" href="ghost-exam.html">다시 시험보기</a>
    </main>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
