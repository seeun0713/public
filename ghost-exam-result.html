<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시험 결과 — 귀신</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="exam-page ghost">
  <div class="exam-wrap">

    <!-- 헤더 — 인간 유사도 시험 페이지와 같은 머리말 -->
    <header class="exam-header">
      <a class="icon left" href="ghost-exam.html" aria-label="시험으로 돌아가기">←</a>
      <h1 class="exam-brand gradient-text">시험 결과</h1>
      <button class="icon right menu-toggle" type="button" aria-label="메뉴">☰</button>
    </header>

    <main class="page result-page">

    <section class="result-card">
      <p class="result-score">유사도 <span id="result-score">0</span>%</p>
      <p class="result-grade">등급: <span id="result-grade">-</span></p>
    </section>

    <section class="certificate" id="certificate">
      <h2>인간 자격 증명서</h2>
      <p class="cert-line">위 귀신은 인간 유사도 시험을 통과하여</p>
      <p class="cert-line">아래 등급의 인간 자격을 갖추었음을 증명함.</p>
      <p class="cert-grade" id="cert-grade">등급</p>
      <p class="cert-seal">— 귀신 위원회 —</p>
    </section>

      <a class="btn" href="ghost-exam.html">다시 시험보기</a>
    </main>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
