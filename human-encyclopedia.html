<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dogam-page human">

  <!-- 헤더 (검정 바 127px) -->
  <header class="dogam-header">
    <a class="icon left" href="index.html" aria-label="홈으로">
      <img src="images/dogam2-icon-back.svg" alt="" />
    </a>
    <h1 class="dogam-brand">귀신 도감</h1>
    <button class="icon right menu-toggle" type="button" aria-label="메뉴">
      <img src="images/dogam2-icon-menu.svg" alt="" />
    </button>
  </header>

  <!-- 오방색 띠 (상단) -->
  <div class="saekdong-band top"></div>

  <main class="dogam-main">

    <!-- 카드 그리드 (4열 × 2줄) -->
    <div class="dogam-grid" id="dogam-grid">

      <!--
        카드 한 장의 구조 설명
        .dogam-photo      : 206×231 크기의 "창"입니다. 넘치는 부분은 잘라냅니다.
        .dogam-photo-img  : 원본 그림(4096×2304)을 786.41% × 394.48%로 크게 늘린 뒤
                            left/top 값만큼 밀어서, 피그마와 똑같은 위치가 보이게 합니다.
                            → 카드마다 left/top 값이 달라서 style 속성으로 직접 적었습니다.
        .dogam-frame      : 사진 안쪽 10px 자리에 그리는 검정 사각 테두리
        .dogam-corner     : 네 귀퉁이의 작은 재단(크롭) 표시

        카드에 class="reveal"이 붙으면 마우스를 올렸을 때
        정체가 드러나는 그림/이름/노리개로 스르륵(dissolve) 바뀝니다.
      -->

      <a class="dogam-card reveal" href="human-encyclopedia-detail.html?ghost=susalgwi" aria-label="수살귀">
        <span class="dogam-photo">
          <img class="dogam-photo-img" src="images/dogam2-2.png" alt="" style="left: -342.98%; top: -65.81%;" />
          <!-- 호버 상태 그림 (평소엔 투명, 마우스 올리면 나타남) -->
          <img class="dogam-photo-img on-hover" src="images/dogam2-hover-susalgwi.png" alt="" aria-hidden="true" style="left: -342.98%; top: -76.43%;" />
          <i class="dogam-frame"></i>
          <i class="dogam-corner tl"></i><i class="dogam-corner tr"></i><i class="dogam-corner bl"></i><i class="dogam-corner br"></i>
        </span>
        <span class="dogam-card-name">
          <span class="name-base">@#$%</span>
          <span class="name-hover">수살귀</span>
        </span>
        <!-- 호버 상태에만 보이는 빨간 노리개 (카드 아래로 늘어집니다) -->
        <img class="dogam-knot" src="images/dogam2-knot-red.svg" alt="" aria-hidden="true" style="left: 156px; width: 84.639px; height: 154px;" />
      </a>

      <a class="dogam-card reveal" href="human-encyclopedia-detail.html?ghost=geolsin" aria-label="걸신">
        <span class="dogam-photo">
          <img class="dogam-photo-img" src="images/dogam2-3.png" alt="" style="left: -342.98%; top: -73.05%;" />
          <!-- 호버 상태 그림 -->
          <img class="dogam-photo-img on-hover" src="images/dogam2-hover-geolsin.png" alt="" aria-hidden="true" style="left: -342.98%; top: -76.43%;" />
          <i class="dogam-frame"></i>
          <i class="dogam-corner tl"></i><i class="dogam-corner tr"></i><i class="dogam-corner bl"></i><i class="dogam-corner br"></i>
        </span>
        <span class="dogam-card-name">
          <span class="name-base">$^#%</span>
          <span class="name-hover">걸신</span>
        </span>
        <!-- 초록 노리개 — 빨간 것보다 좁아서 가운데를 맞추려고 left 값이 다릅니다 -->
        <img class="dogam-knot" src="images/dogam2-knot-green.svg" alt="" aria-hidden="true" style="left: 166.82px; width: 63px; height: 155px;" />
      </a>

      <a class="dogam-card reveal" href="human-encyclopedia-detail.html?ghost=maehwa" aria-label="매화귀신">

          <img class="dogam-photo-img" src="images/dogam2-4.png" alt="" style="left: -342.98%; top: -73.05%;" />
          <!-- 호버 상태 그림 (이 카드는 잘라내는 위치가 다릅니다) -->
          <img class="dogam-photo-img on-hover" src="images/dogam2-hover-maehwa.png" alt="" aria-hidden="true" style="left: -361.69%; top: -86.54%;" />
          <i class="dogam-frame"></i>
          <i class="dogam-corner tl"></i><i class="dogam-corner tr"></i><i class="dogam-corner bl"></i><i class="dogam-corner br"></i>
