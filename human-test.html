<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>귀신 유형 테스트 — 인간</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="typetest-page human">

  <!-- 헤더 (검정 바 127px) -->
  <header class="typetest-header">
    <a class="icon left" href="index.html" aria-label="홈으로">
      <img src="images/dogam2-icon-back.svg" alt="" />
    </a>
    <h1 class="typetest-brand">귀신 유형 테스트</h1>
    <button class="icon right menu-toggle" type="button" aria-label="메뉴">
      <img src="images/dogam2-icon-menu.svg" alt="" />
    </button>
  </header>

  <!-- 오방색 띠 (상단) -->
  <div class="saekdong-band top"></div>

  <!-- 한지 무대 (좌우 끝은 살짝 어둡게) -->
  <main class="typetest-stage">
    <i class="typetest-shade left" aria-hidden="true"></i>
    <i class="typetest-shade right" aria-hidden="true"></i>

    <!-- 퀴즈 (시안: 폭 812, 블록 사이 60px) -->
    <div class="typetest-panel">

      <div class="typetest-progress-block">
        <div class="typetest-topbar">
          <button class="typetest-prev" id="test-prev" type="button">
            <img src="images/typetest-icon-prev.svg" alt="" aria-hidden="true" />
            <span>이전</span>
          </button>
          <span class="typetest-counter" id="test-counter">1/10</span>
        </div>

        <div class="typetest-progress">
          <div class="typetest-progress-fill" id="test-progress-fill"></div>
        </div>
      </div>

      <div class="typetest-ask">
        <p class="typetest-qnum" id="test-qnum">Q1.</p>
        <h2 class="typetest-question" id="test-question">질문이 여기에 표시됩니다.</h2>
      </div>

      <div class="typetest-answers" id="test-answers">
        <!-- 보기 버튼은 js/script.js 에서 생성됩니다 -->
      </div>

    </div>
  </main>

  <!-- 오방색 띠 (하단) -->
  <div class="saekdong-band bottom"></div>

  <!-- 아래 검정 여백 + 흐릿한 손글씨 낙서 -->
  <div class="dogam-graffiti">
    <p>이거 안 지켜도 괜찮아.</p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
