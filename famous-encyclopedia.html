<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유명 한국 괴물</title>
  <link rel="stylesheet" href="css/style.css" />
  <!--
    유명 한국 괴물 — 목록 페이지 (한옥 창호 벽)

    · 머리말·한지 배경·붓 테두리는 상세 페이지(fg-)와 같은 것을 씁니다.
    · 가운데 창문 5개가 괴물 카드입니다. 마우스를 올리면(휴대폰은 한 번 탭)
      창문 두 짝이 양옆으로 밀려 열리고, 방 안에 괴물이 보입니다.
      한 번에 한 짝만 열리고 나머지는 닫힌 채로 둡니다.
      휴대폰은 두 번째 탭에 상세 페이지로 넘어갑니다.
    · 열린 방 안은 시안 672:5214 대로 괴물 색 물빛 + 먹그림 + 창살 + 도장입니다.
      색은 css/style.css 의 :root 에 --tint-<키> 로 모아 두었고,
      상세 페이지 그림칸도 같은 값을 씁니다.
    · 양옆 큰 문은 시안의 그래픽(images/fw-door.svg)을 그대로 씁니다.
    · 닫힌 창의 창살은 이미지 없이 SVG 무늬(아래 --p-...)로 직접 그립니다.
      무늬를 바꾸려면 창문의 style="--pat: var(--p-무늬이름)" 만 바꾸면 됩니다.
    · 이 페이지 전용 스타일은 모두 fw- 로 시작합니다.
    · 이전 목록(검정 카드 그리드)은 famous-encyclopedia.backup.html 에 있습니다.
  -->
  <style>
    :root {
      /* 창살·창틀 색 (검정 단색) */
      --wood: #000;
      --wood-dark: #000;
      --wood-light: #000;
      --hanji: #f1e8d6;
      --p-wanja: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><g fill='none' stroke='%23000' stroke-width='4' stroke-linecap='square'><path d='M0 0H60M0 0V60M30 0V60M0 30H60'/><rect x='-9' y='-9' width='18' height='18'/><rect x='51' y='-9' width='18' height='18'/><rect x='-9' y='51' width='18' height='18'/><rect x='51' y='51' width='18' height='18'/></g></svg>");
      --p-ja: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='56'><g fill='none' stroke='%23000' stroke-width='4' stroke-linecap='square'><path d='M0 0H44M0 0V56M11 14H33V42H11Z'/></g></svg>");
      --p-bitsal: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='46' height='46'><g fill='none' stroke='%23000' stroke-width='5' stroke-linecap='square'><path d='M0 0L46 46M46 0L0 46'/></g></svg>");
      --p-jeong: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='110'><g fill='none' stroke='%23000' stroke-width='5' stroke-linecap='square'><path d='M0 0H90M0 0V110M16 16H74V94H16Z'/></g></svg>");
      --p-palgak: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%23000' stroke-width='4' stroke-linecap='square'><path d='M20 8H44L56 20V44L44 56H20L8 44V20Z M32 0V8M32 56V64M0 32H8M56 32H64 M26 26H38V38H26Z'/></g></svg>");
      --p-mesh: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18'><g fill='none' stroke='%23000' stroke-width='3' stroke-linecap='square'><path d='M0 0L18 18M18 0L0 18'/></g></svg>");
      --p-chain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='24'><g fill='none' stroke='%23000' stroke-width='3' stroke-linecap='square'><path d='M0 12L10 2L20 12L10 22Z M20 12L30 2L40 12L30 22Z'/></g></svg>");
      --p-brick: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='26'><g fill='none' stroke='%23000' stroke-width='4' stroke-linecap='square'><path d='M0 0H52M0 13H52M13 0V13M39 13V26'/></g></svg>");
      --p-octx: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><g fill='none' stroke='%23000' stroke-width='4' stroke-linecap='square'><path d='M18 6H38L50 18V38L38 50H18L6 38V18Z M28 0V56M0 28H56'/></g></svg>");
      --p-nest: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><g fill='none' stroke='%23000' stroke-width='4' stroke-linecap='square'><path d='M30 0L60 30L30 60L0 30Z M30 14L46 30L30 46L14 30Z'/></g></svg>");
      --p-simple: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='84'><path d='M0 0H64M0 0V84' fill='none' stroke='%23000' stroke-width='3'/></svg>");
    }

    /* 창틀·문틀 — 검정 단색 */
    .fw-wood { background: var(--wood); }

    /* ---------- 창호 벽 ---------- */
    .fw-wall {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 17.25fr 20.75fr 24fr 20.75fr 17.25fr;
      aspect-ratio: 2000 / 1245;
      margin-top: 4px;
      background: var(--wood-dark);
    }
    .fw-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* 창살 칸 (문이 아닌 고정 창) — 한지 위에 무늬 */
    .fw-panel {
      position: relative;
      border: 7px solid transparent;
      border-image: linear-gradient(180deg, var(--wood-light), var(--wood-dark)) 1;
      background: var(--pat) center / var(--tile, 40px) repeat, var(--hanji);
    }

    /* ---------- 괴물 창문 (카드) ---------- */
    .fw-win {
      position: relative;
      display: block;
      padding: 16px;                 /* 창틀 두께 */
      color: inherit;
      text-decoration: none;
      outline: none;
    }
    .fw-frame {                       /* 창 안쪽 (여기서 문짝이 미끄러짐) */
      position: relative;
      display: block;
      height: 100%;
      overflow: hidden;
      box-shadow: inset 0 0 0 2px var(--wood-dark);
      /* 비치는 그림자(.fw-shadow)의 multiply 가 창 밖으로 번지지 않게 가둡니다 */
      isolation: isolate;
    }

    /* ---------- 방 안 (창문이 열렸을 때) ----------
       시안 672:5214 의 칸과 같은 구성입니다. 아래에서 위로
         흰 바탕 → 괴물 색 물빛 → 먹그림 → 팔각 창살(아주 옅게) → 도장
       색은 괴물마다 다르고, 창문마다 --tint-rgb 로 지정합니다.
       상세 페이지 그림칸(.fg-figure)과 같은 값을 씁니다. */
    .fw-room {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #fff;
      /* z-index 를 0 으로 못박아 방 안의 겹(물빛·그림·창살·도장)이
         뒤에 오는 문짝 위로 올라오지 않게 합니다. 닫힌 창은 닫혀 보여야 합니다.
         isolation 은 물빛의 multiply 가 방 밖까지 번지지 않게 가둡니다. */
      z-index: 0;
      isolation: isolate;
    }
    .fw-tint {                        /* 괴물 색 물빛 */
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(var(--tint-rgb, var(--tint-gumiho)), 0) 11.213%,
        rgb(var(--tint-rgb, var(--tint-gumiho))) 114.69%
      );
      mix-blend-mode: multiply;
      opacity: .31;
      z-index: 1;
    }
    .fw-lattice {                     /* 팔각 창살 — 그림 위에 13% 로 덮입니다 */
      position: absolute;
      left: 50%;
      top: 50%;
      width: 116%;
      height: auto;
      max-width: none;
      transform: translate(-50%, -50%);
      opacity: .13;
      z-index: 3;
      pointer-events: none;
    }
    .fw-stamp {                       /* 오른쪽 아래 도장 (요괴 / 정령 / 귀신) */
      position: absolute;
      right: 3.55%;
      bottom: 5.2%;
      width: 12.06%;
      height: auto;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity .45s ease .3s;
    }

    .fw-ghost {
      position: absolute;
      left: 50%;
      bottom: -4%;
      height: 108%;
      width: auto;
      max-width: none;
      transform: translate(-50%, 8%) scale(.94);
      z-index: 2;
      filter: blur(1.5px);
      opacity: 0;
      transition: opacity .5s ease .15s, transform .9s cubic-bezier(.2, .8, .2, 1) .1s, filter .9s ease .1s;
    }
    .fw-name {
      position: absolute;
      left: 0;
      right: 0;
      top: 12px;
      z-index: 2;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #000;
      text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 12px #fff;   /* 실루엣 위에서도 읽히게 */
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .4s ease .35s, transform .4s ease .35s;
    }

    /* 미닫이 두 짝 */
    .fw-sash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      border: 9px solid transparent;
      border-image: linear-gradient(180deg, var(--wood-light), var(--wood-dark)) 1;
      background: var(--pat) center / var(--tile, 40px) repeat, var(--hanji);
      transition: transform .75s cubic-bezier(.65, 0, .25, 1);
    }
    .fw-sash.l { left: 0; }
    .fw-sash.r { right: 0; }
    .fw-sash::after {                 /* 문고리 */
      content: "";
      position: absolute;
      top: 50%;
      width: 4px;
      height: 34px;
      margin-top: -17px;
      border-radius: 2px;
      background: var(--hanji);
    }
    .fw-sash.l::after { right: 3px; }
    .fw-sash.r::after { left: 3px; }

    /* ---------- 닫힌 창에 비치는 그림자 ----------
       문짝 위에 같은 그림을 아주 옅게 겹칩니다. multiply 라서 종이만
       은은하게 어두워지고 창살(검정)은 그대로 남아, 창호지 뒤에
       누가 서 있는 것처럼 보입니다.
       창이 열리면 이 그림자는 사라지고 방 안의 진짜 그림이 드러납니다. */
    .fw-shadow {
      position: absolute;
      left: 50%;
      bottom: -4%;
      height: 108%;
      width: auto;
      max-width: none;
      transform: translate(-50%, 0);
      z-index: 3;                     /* 문짝(0)보다 위 */
      opacity: .22;
      filter: blur(4px);
      mix-blend-mode: multiply;
      pointer-events: none;
      transition: opacity .45s ease;
    }
    .fw-win:hover .fw-shadow,
    .fw-win:focus-visible .fw-shadow,
    .fw-win.is-open .fw-shadow { opacity: 0; }

    /* 열림 — 마우스 올림 / 키보드 초점 / 휴대폰 첫 탭 */
    .fw-win:hover .fw-sash.l, .fw-win:focus-visible .fw-sash.l, .fw-win.is-open .fw-sash.l { transform: translateX(-101%); }
    .fw-win:hover .fw-sash.r, .fw-win:focus-visible .fw-sash.r, .fw-win.is-open .fw-sash.r { transform: translateX(101%); }
    .fw-win:hover .fw-ghost, .fw-win:focus-visible .fw-ghost, .fw-win.is-open .fw-ghost {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      filter: blur(0);
    }
    .fw-win:hover .fw-stamp, .fw-win:focus-visible .fw-stamp, .fw-win.is-open .fw-stamp { opacity: 1; }
    .fw-win:hover .fw-name, .fw-win:focus-visible .fw-name, .fw-win.is-open .fw-name { opacity: 1; transform: none; }
    .fw-win:focus-visible { box-shadow: inset 0 0 0 3px #fff; }

    /* ---------- 양옆 큰 문 (띠살 분합문) ----------
       시안 672:5214 의 문 그래픽(images/fw-door.svg)을 그대로 씁니다.
       원본은 192×1014 로 그려졌지만 preserveAspectRatio="none" 이라
       칸 크기에 맞춰 늘어납니다 (시안에서도 같은 방식입니다). */
    .fw-door {
      position: relative;
      background: var(--hanji);
    }
    /* 칸 높이에 맞춰 늘어나야 하므로 띄워서 네 변에 붙입니다.
       (흐름에 두면 원본 높이 1014px 가 그대로 칸을 밀어 올립니다) */
    .fw-door img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .fw-hint {
      position: relative;
      z-index: 1;
      margin: 18px 0 30px;
      text-align: center;
      font-size: 15px;
      color: #3a2a18;
    }

    /* ---------- 좁은 화면 — 큰 문·고정 창을 빼고 창문 5개만 ---------- */
    @media (max-width: 900px) {
      .fw-wall {
        aspect-ratio: auto;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
      }
      .fw-col { display: contents; }
      .fw-door, .fw-panel { display: none; }
      .fw-win { aspect-ratio: 3 / 4; padding: 10px; }
      .fw-win.big { grid-column: 1 / -1; aspect-ratio: 4 / 3; order: -1; }
      .fw-win.big .fw-ghost { height: 112%; }
      .fw-sash { border-width: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fw-sash, .fw-ghost, .fw-name, .fw-shadow, .fw-stamp { transition-duration: .01s; transition-delay: 0s; }
    }
  </style>
</head>
<body class="fg-page">
  <div class="fg-wrap">

    <!-- 한지 배경 두 겹 (상세 페이지와 같음) -->
    <div class="fg-paper" aria-hidden="true">
      <img class="a" src="images/dogam2-bg.jpg" alt="" />
      <img class="b" src="images/fg-paper2.png" alt="" />
    </div>

    <header class="fg-header">
      <a class="icon left" href="index.html" aria-label="홈으로">
        <img src="images/famous-icon-back.svg" alt="" />
      </a>
      <h1 class="fg-title">유명 한국 괴물</h1>
      <button class="icon right menu-toggle" type="button" aria-label="메뉴">
        <img src="images/famous-icon-menu.svg" alt="" />
      </button>
    </header>

    <main class="fw-wall">

      <!-- 왼쪽 큰 문 -->
      <div class="fw-door left" aria-hidden="true">
        <img src="images/fw-door.svg" alt="" />
      </div>

      <!-- 1열: 고정 창 · 처녀귀신 · 고정 창 · 달걀귀신 -->
      <div class="fw-col">
        <span class="fw-panel" style="flex: 9; --pat: var(--p-mesh); --tile: 18px" aria-hidden="true"></span>
        <a class="fw-win fw-wood" style="flex: 41; --pat: var(--p-wanja); --tile: 60px; --tint-rgb: var(--tint-cheonyeo)" href="famous-encyclopedia-detail.html?ghost=cheonyeo" aria-label="처녀귀신">
          <span class="fw-frame">
            <span class="fw-room">
              <i class="fw-tint"></i>
              <img class="fw-ghost" src="images/famous-cheonyeo.png" alt="" />
              <img class="fw-lattice" src="images/fg-lattice.png" alt="" />
              <img class="fw-stamp" src="images/fg-stamp-gwisin.svg" alt="" />
            </span>
            <span class="fw-name">처녀귀신</span>
            <span class="fw-sash l"></span><span class="fw-sash r"></span>
            <img class="fw-shadow" src="images/famous-cheonyeo.png" alt="" />
          </span>
        </a>
        <span class="fw-panel" style="flex: 9; --pat: var(--p-chain); --tile: 40px 24px" aria-hidden="true"></span>
        <a class="fw-win fw-wood" style="flex: 41; --pat: var(--p-ja); --tile: 44px 56px; --tint-rgb: var(--tint-dalgyal)" href="famous-encyclopedia-detail.html?ghost=dalgyal" aria-label="달걀귀신">
          <span class="fw-frame">
            <span class="fw-room">
              <i class="fw-tint"></i>
              <img class="fw-ghost" src="images/famous-dalgyal.png" alt="" />
              <img class="fw-lattice" src="images/fg-lattice.png" alt="" />
              <img class="fw-stamp" src="images/fg-stamp-gwisin.svg" alt="" />
            </span>
            <span class="fw-name">달걀귀신</span>
            <span class="fw-sash l"></span><span class="fw-sash r"></span>
            <img class="fw-shadow" src="images/famous-dalgyal.png" alt="" />
          </span>
        </a>
      </div>

      <!-- 2열(가운데): 고정 창 · 구미호(큰 창) · 고정 창 두 개 -->
      <div class="fw-col">
        <span class="fw-panel" style="flex: 23; --pat: var(--p-brick); --tile: 52px 26px" aria-hidden="true"></span>
        <a class="fw-win fw-wood big" style="flex: 48; --pat: var(--p-bitsal); --tile: 46px; --tint-rgb: var(--tint-gumiho)" href="famous-encyclopedia-detail.html?ghost=gumiho" aria-label="구미호">
          <span class="fw-frame">
            <span class="fw-room">
              <i class="fw-tint"></i>
              <img class="fw-ghost" src="images/famous-gumiho.png" alt="" />
              <img class="fw-lattice" src="images/fg-lattice.png" alt="" />
              <img class="fw-stamp" src="images/fg-stamp-yogoe.svg" alt="" />
            </span>
            <span class="fw-name">구미호</span>
            <span class="fw-sash l"></span><span class="fw-sash r"></span>
            <img class="fw-shadow" src="images/famous-gumiho.png" alt="" />
          </span>
        </a>
        <span class="fw-panel" style="flex: 19; --pat: var(--p-octx); --tile: 56px" aria-hidden="true"></span>
        <span class="fw-panel" style="flex: 10; --pat: var(--p-mesh); --tile: 18px" aria-hidden="true"></span>
      </div>

      <!-- 3열: 어둑시니 · 도깨비 · 고정 창 -->
      <div class="fw-col">
        <a class="fw-win fw-wood" style="flex: 41; --pat: var(--p-jeong); --tile: 90px 110px; --tint-rgb: var(--tint-eoduksini)" href="famous-encyclopedia-detail.html?ghost=eoduksini" aria-label="어둑시니">
          <span class="fw-frame">
            <span class="fw-room">
              <i class="fw-tint"></i>
              <img class="fw-ghost" src="images/famous-eoduksini.png" alt="" />
              <img class="fw-lattice" src="images/fg-lattice.png" alt="" />
              <img class="fw-stamp" src="images/fg-stamp-yogoe.svg" alt="" />
            </span>
            <span class="fw-name">어둑시니</span>
            <span class="fw-sash l"></span><span class="fw-sash r"></span>
            <img class="fw-shadow" src="images/famous-eoduksini.png" alt="" />
          </span>
        </a>
        <a class="fw-win fw-wood" style="flex: 41; --pat: var(--p-palgak); --tile: 64px; --tint-rgb: var(--tint-dokkaebi)" href="famous-encyclopedia-detail.html?ghost=dokkaebi" aria-label="도깨비">
          <span class="fw-frame">
            <span class="fw-room">
              <i class="fw-tint"></i>
              <img class="fw-ghost" src="images/famous-dokkaebi.png" alt="" />
              <img class="fw-lattice" src="images/fg-lattice.png" alt="" />
              <img class="fw-stamp" src="images/fg-stamp-jeongryeong.svg" alt="" />
            </span>
            <span class="fw-name">도깨비</span>
            <span class="fw-sash l"></span><span class="fw-sash r"></span>
            <img class="fw-shadow" src="images/famous-dokkaebi.png" alt="" />
          </span>
        </a>
        <span class="fw-panel" style="flex: 17; --pat: var(--p-nest); --tile: 60px" aria-hidden="true"></span>
      </div>

      <!-- 오른쪽 큰 문 -->
      <div class="fw-door right" aria-hidden="true">
        <img src="images/fw-door.svg" alt="" />
      </div>
    </main>

    <p class="fw-hint">창문에 다가가 보세요. 누군가 안에 있습니다.</p>
  </div>

  <script src="js/script.js"></script>
  <script>
  /* 휴대폰(마우스 올림이 없는 기기): 첫 탭은 창문만 열고, 두 번째 탭에 상세 페이지로 */
  (function () {
    if (!window.matchMedia("(hover: none)").matches) return;
    var wins = document.querySelectorAll(".fw-win");
    wins.forEach(function (win) {
      win.addEventListener("click", function (e) {
        if (win.classList.contains("is-open")) return;   // 두 번째 탭 → 이동
        e.preventDefault();
        wins.forEach(function (w) { w.classList.remove("is-open"); });
        win.classList.add("is-open");
      });
    });
  })();
  </script>
</body>
</html>
