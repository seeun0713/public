<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유명 한국 괴물</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<!--
  유명 한국 괴물 — 상세 페이지 (Figma "Desktop - 113", node 360:11599)

  귀신 도감 상세 페이지와 같은 방식입니다.
  주소 뒤에 ?ghost=... 를 붙이면 그 귀신의 내용이 채워집니다.
    예) famous-encyclopedia-detail.html?ghost=gumiho

  귀신별 글은 js/script.js 의 FAMOUS 목록에 들어 있습니다.
-->
<body class="fg-page">

  <div class="fg-wrap">

    <!--
      한지 배경 두 겹.
      아래장은 하드라이트(hard-light)로 섞여 대비를 만들고,
      위장은 89% 불투명도로 덮여 낡은 종이 결을 냅니다. (시안 그대로)
    -->
    <div class="fg-paper" aria-hidden="true">
      <img class="a" src="images/dogam2-bg.jpg" alt="" />
      <img class="b" src="images/fg-paper2.png" alt="" />
    </div>

    <!-- 두 칸을 가르는 세로 획 (곧은 선이 아니라 손으로 그은 획입니다) -->
    <img class="fg-rule" src="images/fg-line29.svg" alt="" aria-hidden="true" />

    <!-- 헤더 (한지 위 검정 글씨, 두꺼운 검정 테두리) -->
    <header class="fg-header">
      <a class="icon left" href="famous-encyclopedia.html" aria-label="목록으로 돌아가기">
        <img src="images/famous-icon-back.svg" alt="" />
      </a>
      <h1 class="fg-title" id="fg-title">귀신</h1>
      <button class="icon right menu-toggle" type="button" aria-label="메뉴">
        <img src="images/famous-icon-menu.svg" alt="" />
      </button>
    </header>

    <!-- 위쪽: 왼쪽 그림 + 오른쪽 정보표 -->
    <div class="fg-main">
      <!-- 쌓이는 순서(아래→위): 분홍 물빛 → 그림 → 팔각 창살 -->
      <figure class="fg-figure">
        <i class="tint" aria-hidden="true"></i>
        <img class="art" id="fg-image" src="" alt="" />
        <img class="lattice" src="images/fg-lattice.png" alt="" aria-hidden="true" />
      </figure>

      <div class="fg-info" id="fg-info">
        <!-- 정보 줄은 JS가 채웁니다 -->
      </div>
    </div>

    <!-- 아래쪽: 왼쪽 설명 글 + 오른쪽 막대 그래프 -->
    <div class="fg-bottom">
      <div class="fg-texts" id="fg-texts"></div>
      <div class="fg-bars" id="fg-bars"></div>
    </div>

    <!-- 앞/뒤 괴물로 넘어가는 줄 (귀신 도감 상세와 같은 모양).
         주소와 이름은 JS 가 채웁니다. 목록에 놓인 순서대로 넘어가고,
         끝에서는 처음으로 돌아옵니다. -->
    <nav class="gd-pager" aria-label="다른 괴물 보기">
      <a class="gd-nav prev" id="gd-prev" href="#">
        <img src="images/dogam2-icon-back.svg" alt="" aria-hidden="true" />
        <span class="dir">이전</span>
        <span class="name" id="gd-prev-name"></span>
      </a>

      <!-- 두 버튼 사이를 메우는 칸 -->
      <span class="gd-pager-fill" aria-hidden="true"></span>

      <a class="gd-nav next" id="gd-next" href="#">
        <span class="name" id="gd-next-name"></span>
        <span class="dir">다음</span>
        <img src="images/dogam2-icon-back.svg" alt="" aria-hidden="true" />
      </a>
    </nav>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
