<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유명 한국 괴물</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<!--
  유명 한국 괴물 — 상세 페이지 (Figma "Desktop - 113", node 360:11599)

  귀신 도감 상세 페이지와 같은 방식입니다.
  주소 뒤에 ?ghost=... 를 붙이면 그 귀신의 내용이 채워집니다.
    예) famous-encyclopedia-detail.html?ghost=gumiho

  귀신별 글은 js/script.js 의 FAMOUS 목록에 들어 있습니다.
-->
<body class="fg-page">

  <div class="fg-wrap">

    <!-- 헤더 (한지 위 검정 글씨, 두꺼운 검정 테두리) -->
    <header class="fg-header">
      <a class="icon left" href="famous-encyclopedia.html" aria-label="목록으로 돌아가기">
        <img src="images/famous-icon-back.svg" alt="" />
      </a>
      <h1 class="fg-title" id="fg-title">귀신</h1>
      <button class="icon right menu-toggle" type="button" aria-label="메뉴">
        <img src="images/famous-icon-menu.svg" alt="" />
      </button>
    </header>

    <!-- 위쪽: 왼쪽 그림 + 오른쪽 정보표 -->
    <div class="fg-main">
      <figure class="fg-figure">
        <img class="art" id="fg-image" src="" alt="" />
        <i class="tint" aria-hidden="true"></i>
        <img class="decor decor-1" src="images/famous-decor1.svg" alt="" aria-hidden="true" />
        <img class="decor decor-2" src="images/famous-decor2.svg" alt="" aria-hidden="true" />
        <!-- 모서리를 비스듬히 잘라내는 검정 덮개 -->
        <img class="cut" src="images/famous-frame.svg" alt="" aria-hidden="true" />
      </figure>

      <div class="fg-info" id="fg-info">
        <!-- 정보 줄은 JS가 채웁니다 -->
      </div>
    </div>

    <!-- 아래쪽: 왼쪽 설명 글 + 오른쪽 막대 그래프 -->
    <div class="fg-bottom">
      <div class="fg-texts" id="fg-texts"></div>
      <div class="fg-bars" id="fg-bars"></div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
