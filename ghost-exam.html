<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인간 유사도 시험 — 귀신</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="exam-page ghost">
  <div class="exam-wrap">

    <!-- 헤더 (시안: 제목은 그라데이션이 아니라 흰색 48px) -->
    <header class="exam-header">
      <a class="icon left" href="index.html" aria-label="홈으로">
        <img src="images/dogam2-icon-back.svg" alt="" />
      </a>
      <h1 class="exam-brand">인간 유사도 시험</h1>
      <button class="icon right menu-toggle" type="button" aria-label="메뉴">
        <img src="images/dogam2-icon-menu.svg" alt="" />
      </button>
    </header>

    <!-- 4모서리 장식 -->
    <i class="exam-corner tl"></i>
    <i class="exam-corner tr"></i>
    <i class="exam-corner bl"></i>
    <i class="exam-corner br"></i>

    <!-- 퀴즈 -->
    <main class="exam-panel" id="quiz">
      <div class="exam-progress-block">
        <div class="exam-topbar">
          <button class="exam-prev" id="exam-prev" type="button">
            <img src="images/dogam2-icon-back.svg" alt="" aria-hidden="true" />
            <span>이전</span>
          </button>
          <span class="exam-counter" id="exam-counter">1/10</span>
        </div>

        <div class="exam-progress">
          <div class="exam-progress-fill" id="exam-progress-fill"></div>
        </div>
      </div>

      <div class="exam-ask">
        <p class="exam-qnum gradient-text" id="exam-qnum">Q1.</p>
        <h2 class="exam-question" id="exam-question">질문이 여기에 표시됩니다.</h2>
      </div>

      <div class="exam-answers" id="exam-answers">
        <!-- 보기 버튼은 js/script.js 에서 생성됩니다 -->
      </div>
    </main>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
