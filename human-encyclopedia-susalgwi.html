<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수살귀 — 귀신 도감</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="detail">
  <div class="detail-wrap">

    <!-- 장식 레이어: 배경 텍스처 / 먹 번짐 / 노리개 / 핏방울 -->
    <div class="detail-decor">
      <img class="decor-bg" src="images/bg-texture.jpg" alt="" />
      <img class="decor-ink ink-1" src="images/ink-texture.png" alt="" />
      <img class="decor-ink ink-2" src="images/ink-texture.png" alt="" />
      <img class="knot" src="images/norigae-knot.svg" alt="" />
      <!-- 핏방울 (간단한 SVG) -->
      <svg class="blood-drip" viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="0" width="20" height="6" fill="#d51313" />
        <path d="M30 6 C30 6 18 70 18 95 a12 12 0 0 0 24 0 C42 70 30 6 30 6 Z" fill="#d51313" />
        <circle cx="14" cy="120" r="7" fill="#d51313" />
        <circle cx="22" cy="140" r="5" fill="#d51313" />
      </svg>
    </div>

    <!-- 헤더 -->
    <header class="detail-header">
      <a class="header-icon left" href="human-encyclopedia.html" aria-label="도감으로 돌아가기">←</a>
      <h1 class="detail-title">수살귀</h1>
      <button class="header-icon right menu-toggle" type="button" aria-label="메뉴">☰</button>
    </header>

    <!-- 오방색 띠 -->
    <div class="saekdong-band"></div>

    <!-- 본문: 좌측 일러스트 + 우측 정보 -->
    <div class="detail-main">
      <figure class="ghost-figure">
        <img src="images/susalgwi.png" alt="수살귀 일러스트" />
      </figure>

      <div class="info-panel">
        <div class="info-row">
          <span class="label">이름</span>
          <span class="value">수살귀</span>
        </div>
        <div class="info-row blue">
          <span class="label">지역</span>
          <span class="value">불특정</span>
        </div>
        <div class="info-row">
          <span class="label">죽음</span>
          <span class="value">익사</span>
        </div>
        <div class="info-row yellow">
          <span class="label">목적</span>
          <span class="value">자신을 대체할 희생양 찾기, 외로움에 친구 찾기</span>
        </div>
        <div class="info-row red">
          <span class="label">위험도</span>
          <span class="value danger-stars">★★★★★</span>
        </div>

        <!-- 능력치 레이더 차트 -->
        <div class="stats">
          <p class="stats-label">능력치</p>
          <svg class="radar" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <!-- 바깥 흰색 오각형 (배경 채움) -->
            <polygon points="150,30 264.13,112.92 220.53,247.08 79.47,247.08 35.87,112.92"
                     fill="#ffffff" stroke="#ffffff" stroke-width="2" />
            <!-- 안쪽 동심 오각형 격자선 -->
            <polygon points="150,60 235.6,122.19 202.9,222.81 97.1,222.81 64.4,122.19"
                     fill="none" stroke="#c9c9c9" stroke-width="1" />
            <polygon points="150,90 207.07,131.46 185.27,198.54 114.73,198.54 92.93,131.46"
                     fill="none" stroke="#c9c9c9" stroke-width="1" />
            <polygon points="150,120 178.53,140.73 167.63,174.27 132.37,174.27 121.47,140.73"
                     fill="none" stroke="#c9c9c9" stroke-width="1" />
            <!-- 중심에서 각 꼭짓점으로 향하는 축 -->
            <g stroke="#c9c9c9" stroke-width="1">
              <line x1="150" y1="150" x2="150" y2="30" />
              <line x1="150" y1="150" x2="264.13" y2="112.92" />
              <line x1="150" y1="150" x2="220.53" y2="247.08" />
              <line x1="150" y1="150" x2="79.47" y2="247.08" />
              <line x1="150" y1="150" x2="35.87" y2="112.92" />
            </g>
            <!-- 중심점 -->
            <circle cx="150" cy="150" r="3" fill="#000000" />
            <!-- 축 이름 -->
            <g fill="#ffffff" font-size="16" font-family="Pretendard Variable, sans-serif">
              <text x="150" y="22" text-anchor="middle">힘</text>
              <text x="276" y="112" text-anchor="start">서사성</text>
              <text x="226" y="268" text-anchor="middle">개성</text>
              <text x="74" y="268" text-anchor="middle">지능</text>
              <text x="24" y="112" text-anchor="end">친화력</text>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- 특성 및 스토리 -->
    <section class="detail-story">
      <h2>특성 및 스토리</h2>
      <p>몸에서 물 떨어짐, 긴머리, 물비린내, 한기. 활동범위-물을 벗어날 수 없음. 비나 홍수로 인해 활동범위가 늘어날 수 있음.</p>
      <p>익사시키는 방법은 크게 3가지로 회오리를 일으키거나 발을 잡아 물 안에 가두는 방법, 햇빛으로 수면을 반짝여 유혹하는 방법, 흐리거나 비오는 날 울음소리를 이용해 홀리는 방법이 있다.</p>
    </section>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
